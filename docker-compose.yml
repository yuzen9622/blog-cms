services:
  blog-cms:
    build:
      context: .
      dockerfile: Dockerfile
    image: blog-cms:latest
    container_name: blog-cms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
    ports:
      
      - "127.0.0.1:1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1337/_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: blog-cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapi-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: blog-cms-cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # token 由 .env 的 CLOUDFLARE_TOKEN 注入（compose 自動讀取 .env 做變數替換）
      TUNNEL_TOKEN: ${CLOUDFLARE_TOKEN}
    depends_on:
      - blog-cms

volumes:
  strapi-data:
